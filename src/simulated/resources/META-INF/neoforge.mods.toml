ordering="AFTER"
side="BOTH"

[[dependencies.create_connected_simulated]]
modId="minecraft"
type="required"
versionRange="${minecraft_version_range}"
ordering="NONE"
side="BOTH"

[[dependencies.create_connected_simulated]]
modId="neoforge"
type="required"
versionRange="${neoforge_version_range}"
ordering="NONE"
side="BOTH"

[[mixins]]
config="create_connected_simulated.mixins.json"
