plugins {
    id 'idea'
    id 'java-library'
    id 'maven-publish'
    id 'net.neoforged.moddev' version '2.0.141'
}

version = mod_version
group = mod_group_id

base {
    archivesName = mod_id
}

sourceSets { simulated }
sourceSets.simulated.compileClasspath += sourceSets.main.output + sourceSets.main.compileClasspath
sourceSets.simulated.runtimeClasspath += sourceSets.main.output + sourceSets.main.runtimeClasspath

// Java version target
java.toolchain.languageVersion = JavaLanguageVersion.of(25)

// NFRT 2.0.31 includes JST 2.0.11's fix for anonymous-class access transformers.
// Earlier JST leaves HolderSet$1.contents protected after widening Named.contents.
neoFormRuntime {
    version = '2.0.31'
}

println "Java: ${System.getProperty 'java.version'}, JVM: ${System.getProperty 'java.vm.version'} (${System.getProperty 'java.vendor'}), Arch: ${System.getProperty 'os.arch'}"

neoForge {
    version = neoforge_version

    validateAccessTransformers = true

    accessTransformers {
        file('src/main/resources/META-INF/accesstransformer.cfg')
    }

    if (parchment_version != 'none') {
        parchment {
            mappingsVersion = parchment_version
            minecraftVersion = parchment_minecraft_version
        }
    }

    runs {
        configureEach {
            gameDirectory = project.file('run')

            systemProperty 'forge.logging.markers', 'REGISTRIES'

            logLevel = org.slf4j.event.Level.DEBUG

            //Allows for reloading the project during runtime with compatible jvm
            jvmArgument "-XX:+IgnoreUnrecognizedVMOptions"
            jvmArgument "-XX:+AllowEnhancedClassRedefinition"
        }

        client {
            client()

            systemProperty 'neoforge.enabledGameTestNamespaces', project.mod_id
        }

        server {
            server()

            gameDirectory = project.file('run-server')
            programArgument '--nogui'
            systemProperty 'neoforge.enabledGameTestNamespaces', project.mod_id
        }

        gameTestServer {
            type = "gameTestServer"

            systemProperty 'neoforge.enabledGameTestNamespaces', project.mod_id
        }

        data {
            type = "serverData"

            gameDirectory = project.file('run-data')
            // Keep migration runs from replacing the checked-in generated assets.
            programArguments.addAll '--mod', mod_id, '--all', '--output', file('build/generated/runData/').getAbsolutePath(), '--existing', file('src/main/resources/').getAbsolutePath(), '--existing', file('src/generated/resources/').getAbsolutePath(), '--existing-mod', 'create', '--existing-mod', 'simulated', '--existing-mod', 'dye_depot'
        }
    }

    mods {
        "${mod_id}" {
            sourceSet(sourceSets.main)
        }
    }
}

// Include resources generated by data generators.
sourceSets.main.resources { srcDir 'src/generated/resources' }

configurations {
    runtimeClasspath.extendsFrom localRuntime
}

// Prepare these files with tools/prepare_build_dependencies_262.py.
// Nested Create libraries are compile-only: Create already supplies them at runtime.
def adaptedManifestFile = file('build/dependencies-26.2/manifest.json')
def adaptedManifest = adaptedManifestFile.isFile()
        ? new groovy.json.JsonSlurper().parseText(providers.fileContents(
                layout.projectDirectory.file('build/dependencies-26.2/manifest.json')).asText.get()) : [:]
def adaptedEntries = adaptedManifest.entries ?: []

dependencies {
    implementation files(adaptedEntries.findAll { it.runtime }.collect { file(it.path) })
    compileOnly files(adaptedEntries.findAll { !it.runtime && it.role != 'simulated' }.collect { file(it.path) })
    simulatedCompileOnly files(adaptedEntries.findAll { it.role == 'simulated' }.collect { file(it.path) })
}

def adaptedProjectRoot = projectDir.canonicalFile

tasks.register('verifyAdaptedDependencies') {
    group = 'verification'
    description = 'Verify the staged, pinned Create 26.2 dependency files and hashes.'
    inputs.file(adaptedManifestFile).optional()
    inputs.files(adaptedEntries.collect { file(it.path) })
    doLast {
        if (!adaptedManifestFile.isFile())
            throw new GradleException('Run python tools/prepare_build_dependencies_262.py first.')
        def manifest = new groovy.json.JsonSlurper().parse(adaptedManifestFile)
        if (manifest.schema != 1 || manifest.minecraft != '26.2'
                || manifest.neoforge != '26.2.0.88'
                || manifest.create_version != '6.0.11-adapted-1.20')
            throw new GradleException('Dependency manifest does not match the diagnosed 26.2 baseline.')
        def roles = manifest.entries.collect { it.role }
        if (roles.size() != roles.toSet().size()
                || !roles.containsAll(['create', 'catnip', 'flywheel', 'ponder', 'registrate', 'jei', 'annotations', 'rei', 'architectury']))
            throw new GradleException('Missing or duplicate staged dependency roles.')
        manifest.entries.each { entry ->
            def dependency = new File(adaptedProjectRoot, entry.path).canonicalFile
            if (!dependency.toPath().startsWith(adaptedProjectRoot.toPath()) || !dependency.isFile())
                throw new GradleException("Missing or external staged dependency: ${entry.role}")
            def hash = java.security.MessageDigest.getInstance('SHA-256').digest(dependency.bytes).encodeHex().toString()
            if (hash != entry.sha256)
                throw new GradleException("Staged dependency hash mismatch: ${entry.role}")
            if (entry.role == 'create' && hash != 'c49f26a6fc3cfa29746ba41d9506b4c38888f6081ee240de086ecd082f79c77a')
                throw new GradleException('Create is not the diagnosed 1.20 binary.')
        }
        logger.lifecycle("Verified ${manifest.entries.size()} staged adapted dependencies.")
    }
}

tasks.register('requireSimulatedDependency') {
    group = 'verification'
    description = 'Require the real Simulated API for the optional bridge source set.'
    dependsOn tasks.named('verifyAdaptedDependencies')
    inputs.file(adaptedManifestFile).optional()
    doLast {
        def manifest = new groovy.json.JsonSlurper().parse(adaptedManifestFile)
        if (!manifest.entries.any { it.role == 'simulated' })
            throw new GradleException('Simulated 26.2 is missing. Supply its real JAR with python tools/prepare_build_dependencies_262.py --simulated-jar <path>. The optional bridge sources remain available in src/simulated/java.')
    }
}

tasks.named('compileJava') {
    dependsOn tasks.named('verifyAdaptedDependencies')
}

tasks.named('compileSimulatedJava') {
    dependsOn tasks.named('requireSimulatedDependency')
}

tasks.matching { it.name in ['runClient', 'runServer', 'runData', 'runGameTestServer'] }.configureEach {
    dependsOn tasks.named('verifyAdaptedDependencies')
}

// Expands all declared replace properties in the specified resource targets.
processResources {
    duplicatesStrategy(DuplicatesStrategy.EXCLUDE)
    filteringCharset = 'UTF-8'

    var replaceProperties = [
            minecraft_version      : minecraft_version,
            minecraft_version_range: minecraft_version_range,
            neoforge_version       : neoforge_version,
            neoforge_version_range : neoforge_version_range,
            loader_version_range   : loader_version_range,
            create_version_range   : create_version_range,
            mod_id                 : mod_id,
            mod_name               : mod_name,
            mod_license            : mod_license,
            mod_version            : mod_version,
            mod_authors            : mod_authors,
            mod_description        : mod_description,
    ]
    inputs.properties replaceProperties

    filesMatching(['META-INF/neoforge.mods.toml', 'pack.mcmeta']) {
        expand replaceProperties
    }
}

tasks.named('processSimulatedResources') {
    dependsOn tasks.named('requireSimulatedDependency')
    def bridgeProperties = [loader_version_range: loader_version_range,
            mod_license: mod_license, mod_version: mod_version, mod_authors: mod_authors,
            minecraft_version_range: minecraft_version_range, neoforge_version_range: neoforge_version_range]
    inputs.properties bridgeProperties
    filesMatching('META-INF/neoforge.mods.toml') { expand bridgeProperties }
}

tasks.register('simulatedJar', Jar) {
    group = 'build'
    description = 'Build the optional Simulated bridge with its real 26.2 dependency.'
    archiveClassifier = 'simulated'
    from sourceSets.simulated.output
    from 'LICENSE'
}

java.withSourcesJar()
tasks.named('sourcesJar') { from 'LICENSE' }
tasks.register('simulatedSourcesJar', Jar) {
    group = 'build'
    archiveClassifier = 'simulated-sources'
    from sourceSets.simulated.allSource
    from 'LICENSE'
}

// Get properties into the manifest for reading at runtime.
jar {
    from 'LICENSE'
    duplicatesStrategy(DuplicatesStrategy.EXCLUDE)

    manifest {
        attributes([
                'Specification-Title'     : mod_id,
                'Specification-Vendor'    : mod_authors,
                'Specification-Version'   : '1', // We are version 1 of ourselves
                'Implementation-Title'    : project.name,
                'Implementation-Version'  : project.jar.archiveVersion,
                'Implementation-Vendor'   : mod_authors,
                'Implementation-Timestamp': new Date().format("yyyy-MM-dd'T'HH:mm:ssZ")
        ])
    }
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8' // Use the UTF-8 charset for Java compilation
}

idea {
    module {
        downloadSources = true
        downloadJavadoc = true
    }
}

wrapper {
    gradleVersion = '9.5.0'
    distributionType = Wrapper.DistributionType.BIN
}
